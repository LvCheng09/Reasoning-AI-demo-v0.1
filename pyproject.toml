[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-reasoning-demo"
version = "0.1.0"
description = "A runnable event graph reasoning demonstration"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "networkx>=3.3",
  "numpy>=1.26",
  "requests>=2.31",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
demo = [
  "torch>=2.2",
  "transformers>=4.41",
  "sentencepiece>=0.2",
  "accelerate>=0.33",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["main_part*", "semantic_frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
